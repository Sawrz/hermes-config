name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: nix-heavy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: https://github.com/cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
          extra_nix_config: experimental-features = nix-command flakes
      - name: Configure private source access
        env:
          NIX_FORGEJO_SSH_KEY: ${{ secrets.NIX_FORGEJO_SSH_KEY }}
        run: python3 scripts/ci_source_access.py
      # Native checks run with a writable store: --no-build makes filtered
      # sources unavailable to importNpmLock on a fresh runner. Partitions keep
      # evaluator memory bounded while checking every output and native check.
      - name: Check standalone outputs and build checks
        run: python3 recovery/sources.py run --source . --target checks -- python3 scripts/ci_flake_check.py --flake "{flake}"
